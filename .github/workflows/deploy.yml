name: Deploy

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
      - name: Install modules
        run: npm ci
      - name: Build
        run: npm run build
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
